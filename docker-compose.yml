services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geosas-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - geosas-storage:/var/www/html/storage
      - geosas-database:/var/www/html/database
    env_file: .env
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost}
    networks:
      - geosas

volumes:
  geosas-storage:
  geosas-database:

networks:
  geosas:
    driver: bridge
