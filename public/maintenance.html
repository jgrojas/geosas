<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mantenimiento - Geo Creaciones en Madera</title>
    <link rel="icon" href="/img/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=dm-sans:500,600,700" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: linear-gradient(180deg, #fafaf9 0%, #f5f5f4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
            color: #1c1917;
        }
        .card {
            max-width: 28rem;
            background: #fff;
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 4px 24px rgba(28, 25, 23, 0.08);
            border: 1px solid #e7e5e4;
        }
        img { height: 4rem; margin-bottom: 1.5rem; }
        .code { font-size: 3rem; font-weight: 700; color: #d97706; }
        h1 { font-size: 1.25rem; margin: 0.5rem 0 0.75rem; }
        p { color: #57534e; font-size: 0.9375rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/img/Logo.png" alt="Geo Creaciones en Madera">
        <div class="code">503</div>
        <h1>Estamos en mantenimiento</h1>
        <p>Actualizamos el sitio. Vuelve en unos minutos.</p>
    </div>
</body>
</html>
